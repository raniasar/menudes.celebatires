<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MangerMalin — Bien manger, simplement.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rouge: #E63946;
      --rouge-dark: #c1121f;
      --noir: #0d0d0d;
      --blanc: #fafafa;
      --gris: #f4f4f4;
      --gris-texte: #666;
      --rayon: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--blanc);
      color: var(--noir);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 6%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      transition: box-shadow .3s;
    }
    nav.scrolled { box-shadow: 0 4px 30px rgba(0,0,0,0.08); }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--rouge);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      display: flex; flex-direction: column; line-height: 1.15;
    }
    .logo-text span:first-child {
      font-size: 16px; font-weight: 700;
      color: var(--rouge);
    }
    .logo-text span:last-child {
      font-size: 14px; font-weight: 400;
      color: var(--gris-texte);
    }

    .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
    .nav-links a {
      text-decoration: none; color: var(--noir);
      font-size: 14px; font-weight: 500;
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--rouge); }

    .nav-cta {
      background: var(--rouge) !important;
      color: #fff !important;
      padding: 11px 24px !important;
      border-radius: 50px !important;
      font-weight: 600 !important;
      transition: background .2s, transform .2s !important;
    }
    .nav-cta:hover { background: var(--rouge-dark) !important; transform: translateY(-1px); }

    .burger {
      display: none;
      flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 4px;
    }
    .burger span {
      display: block; width: 24px; height: 2px;
      background: var(--noir); border-radius: 2px;
      transition: .3s;
    }

    /* ── HERO ── */
    #accueil {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 7% 80px;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 50%, #fff8f5 100%);
      position: relative;
      overflow: hidden;
    }

    /* Fond décoratif radial subtil */
    #accueil::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(230,57,70,.07) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ── TEXTE ── */
    .hero-text { flex: 1; max-width: 580px; }

    .hero-text h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(38px, 4.5vw, 60px);
      font-weight: 800;
      line-height: 1.08;
      margin-bottom: 36px;
      animation: fadeUp .6s ease both;
    }
    .hero-text h1 .rouge { color: var(--rouge); }
    .hero-text h1 .noir  { color: #111; }

    .hero-btns {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 52px;
      animation: fadeUp .6s .15s ease both;
    }

    .btn-primary {
      background: var(--rouge);
      color: #fff;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: background .2s, transform .2s, box-shadow .2s;
      box-shadow: 0 8px 28px rgba(230,57,70,.28);
      display: inline-block;
    }
    .btn-primary:hover {
      background: var(--rouge-dark);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(230,57,70,.38);
    }

    .btn-secondary {
      background: transparent;
      color: #111;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border: 1.5px solid #ddd;
      transition: border-color .2s, color .2s, transform .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      border-color: var(--rouge);
      color: var(--rouge);
      transform: translateY(-2px);
    }

    /* Stats */
    .hero-stats {
      display: flex;
      gap: 40px;
      animation: fadeUp .6s .3s ease both;
    }
    .stat-item {}
    .stat-num {
      font-family: 'DM Sans', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #111;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-item:nth-child(1) .stat-num { color: #111; }
    .stat-item:nth-child(1) .stat-num span { color: var(--rouge); }
    .stat-item:nth-child(2) .stat-num { color: var(--rouge); }
    .stat-item:nth-child(3) .stat-num { color: #111; }
    .stat-item:nth-child(3) .stat-num span { color: var(--rouge); }

    .stat-label {
      font-size: 13px;
      color: #888;
      font-weight: 400;
    }

    /* ── IMAGE ── */
    .hero-image {
      flex: 0 0 480px;
      animation: fadeLeft .7s .1s ease both;
    }

    .hero-img-wrap {
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.11);
      aspect-ratio: 1 / 1;
      background: #f0e8e0;
    }
    .hero-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-float {
      display: block;
      margin-top: 14px;
      background: #fff;
      border-radius: 16px;
      padding: 16px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
      width: 100%;
    }
    .hero-float p:first-child {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }
    .hero-float p:last-child {
      font-size: 13px;
      color: var(--rouge);
      font-weight: 500;
    }

    /* ── OFFRES ── */
    #offres {
      padding: 100px 6%;
      background: var(--gris);
    }

    .section-header {
      text-align: center;
      margin-bottom: 60px;
    }
    .section-pill {
      display: inline-block;
      background: #fff3f3; color: var(--rouge);
      border: 1px solid rgba(230,57,70,.2);
      padding: 6px 18px; border-radius: 50px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 3.5vw, 44px);
      font-weight: 900; margin-bottom: 14px;
    }
    .section-header p {
      color: var(--gris-texte); font-size: 16px;
      max-width: 500px; margin: 0 auto; font-weight: 300;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      transition: transform .3s, box-shadow .3s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 50px rgba(0,0,0,.12);
    }
    .card-badge-promo {
      position: absolute; top: 14px; right: 14px;
      background: var(--rouge); color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 5px 10px; border-radius: 50px;
      z-index: 2; text-transform: uppercase; letter-spacing: .5px;
    }
    .card-image {
      width: 100%; aspect-ratio: 16/10;
      background: linear-gradient(145deg, #ffe8e8, #ffd6a5);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 22px; }
    .card-restaurant {
      font-size: 12px; font-weight: 700;
      color: var(--rouge); letter-spacing: .5px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .card-top {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 700;
    }
    .card-price { font-size: 22px; font-weight: 700; color: var(--rouge); }
    .card-price-old {
      font-size: 13px; color: #bbb;
      text-decoration: line-through; font-weight: 400;
    }
    .card-desc {
      font-size: 14px; color: var(--gris-texte);
      line-height: 1.6; margin-bottom: 20px; font-weight: 300;
    }
    .btn-commander {
      width: 100%;
      background: var(--rouge); color: #fff;
      border: none; padding: 13px 20px;
      border-radius: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s, transform .2s;
    }
    .btn-commander:hover { background: var(--rouge-dark); transform: translateY(-1px); }
<!-- ── OFFRES ── -->

<script>
  const burger = document.getElementById('burger');
  const navLinks = document.getElementById('navLinks');
  burger.addEventListener('click', () => navLinks.classList.toggle('open'));
  document.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
  });

  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => { if (e.isIntersecting) setTimeout(() => e.target.classList.add('visible'), i * 100); });
  }, { threshold: 0.12 });
  reveals.forEach(r => observer.observe(r));

  function ouvrirCommande(repas) {
    const select = document.getElementById('repas');
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].text === repas) { select.selectedIndex = i; break; }
    }
    document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
    setTimeout(() => document.getElementById('prenom').focus(), 700);
  }

  function envoyerCommande() {
    const prenom = document.getElementById('prenom').value.trim();
    const nom = document.getElementById('nom').value.trim();
    const telephone = document.getElementById('telephone').value.trim();
    const adresse = document.getElementById('adresse').value.trim();
    const repas = document.getElementById('repas').value;
    const livraison = document.getElementById('livraison').value;

    if (!prenom || !telephone || !adresse) {
      alert('⚠️ Veuillez remplir au minimum votre prénom, téléphone et adresse.');
      return;
    }

    document.getElementById('modalTitle').textContent = 'Commande confirmée 🎉';
    document.getElementById('modalDesc').textContent = `Merci ${prenom} ${nom} ! Votre commande pour "${repas}" a bien été reçue. Livraison : ${livraison}. Nous allons vous rappeler rapidement au ${telephone} pour confirmer.`;

    document.getElementById('modalOverlay').classList.add('active');

    ['prenom','nom','telephone','adresse','message'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('repas').selectedIndex = 0;
    document.getElementById('livraison').selectedIndex = 0;
  }

  function fermerModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) fermerModal();
  });
</script>

</body>
</html>
